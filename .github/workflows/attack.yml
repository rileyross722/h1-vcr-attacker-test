name: VCR OIDC cross-repo test
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  attack:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt VCR login for a team this repo is not authorized for
        id: vcrlogin
        uses: vercel/vcr-action/login@v1
        with:
          team: team_Lm7pHWSdhXVXMXNnEzhRlu3O
        continue-on-error: true
      - name: Report outcome
        run: echo "login outcome -> ${{ steps.vcrlogin.outcome }}"
